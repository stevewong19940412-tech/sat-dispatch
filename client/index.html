<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[B9656] 遥感卫星任务规划系统</title>
<meta name="build-stamp" content="1794979656">
<script>
// 构建版本自检：localStorage 里的 stamp 与当前 HTML 不一致 → 自动强刷一次（防止旧HTML+旧JS缓存）
(function() {
  try {
    var cur = document.querySelector('meta[name="build-stamp"]').content;
    var seen = localStorage.getItem('buildStamp');
    if (seen && seen !== cur) {
      localStorage.setItem('buildStamp', cur);
      location.reload(true);
      return;
    }
    localStorage.setItem('buildStamp', cur);
  } catch(e) {}
})();
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
